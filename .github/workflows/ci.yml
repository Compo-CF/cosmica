name: iOS build and tests

# Simulator build + CosmicaTests, plus a screenshot walk of every screen (v4.0 visual
# audit). Ad-hoc signed, see scripts/ci.sh. The repo is public, so macOS minutes are free.
on:
  push:
    branches: [v4.0, main]
    paths:
      - 'Cosmica/**'
      - 'CosmicaTests/**'
      - 'CosmicaUITests/**'
      - 'CosmicaWidget/**'
      - 'project.yml'
      - 'scripts/ci.sh'
      - 'scripts/ci-screens.sh'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build and unit tests
        run: bash scripts/ci.sh
      - name: Errors (build job)
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -150 || true
      - name: Failed tests
        if: failure()
        run: |
          grep -E "error: -\[|Test Case .* failed|failed \(|Fatal error|crashed|unexpected exit|Restarting after" build.log | head -120 || true
          echo "----- tail of build.log -----"
          tail -60 build.log || true

  screens:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Screenshot walk
        run: bash scripts/ci-screens.sh
      - name: Screens log (always)
        if: always()
        run: |
          grep -nE "error|Crash|crash|Fatal|terminat|EXC_|Test Case" screens.log | head -80 || true
      - name: Errors (screens job)
        if: failure()
        run: |
          grep -E "error:|Test Case .* failed" screens.log | sort -u | head -80 || true
          tail -40 screens.log || true
      - name: Publish to the ci-screens branch
        if: success()
        run: |
          SHA=$(git rev-parse --short HEAD)
          mkdir -p /tmp/pub && cp shots/*.png /tmp/pub/
          cd /tmp/pub
          git init -q -b ci-screens
          git config user.name "cosmica-ci"
          git config user.email "cosmica-ci@users.noreply.github.com"
          echo "Screens from v4.0 @ $SHA" > README.md
          git add -A && git commit -qm "screens @ $SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screens
