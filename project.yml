name: Cosmica
options:
  bundleIdPrefix: com.centricfiber
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # v3.0.3 â€” version lives HERE, once, for both the app and the widget
    # extension (App Store rejects an extension whose version differs from
    # its app). scripts/testflight.sh overrides CURRENT_PROJECT_VERSION with the git
    # commit count; the value here only matters for manual Xcode archives.
    MARKETING_VERSION: "4.0.7"
    CURRENT_PROJECT_VERSION: "40"
    TARGETED_DEVICE_FAMILY: "1"
    ALWAYS_SEARCH_USER_PATHS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: "7H5T5AR2X5"
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: "12.0.0"
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: "3.0.0"
targets:
  Cosmica:
    type: application
    platform: iOS
    # scripts/testflight.sh runs `xcodebuild test -scheme Cosmica`, so the scheme must include the tests.
    scheme:
      testTargets:
        - CosmicaTests
    sources:
      - path: Cosmica
        excludes:
          - "**/.DS_Store"
          - "**/Info.plist"
          - "**/*.entitlements"
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Cosmica
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # v3.0.3 â€” widget tap deep link (cosmica://observatory).
        CFBundleURLTypes:
          - CFBundleURLName: com.centricfiber.cosmica
            CFBundleURLSchemes:
              - cosmica
        UILaunchScreen:
          UIColorName: "LaunchBackground"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # v4.0 — Xcode 26 upload validation: an iPad build must list all four orientations
        # (iPad multitasking). iPhone stays portrait-only via the key above.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSUserTrackingUsageDescription: "Cosmica uses your identifier to show more relevant ads and support the game."
        GADApplicationIdentifier: "ca-app-pub-1927040492403163~7701480321"
        ITSAppUsesNonExemptEncryption: false
        # 4.0.7 — SKAdNetwork IDs (50, from Critter Conga's list: Google cstr6suwn9, Meta v9wttpbfk9 + n38lu8286q)
        # so Meta can optimize installs and AdMob bidding gets attribution.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: 22mmun2rn5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: 2u9pt9hc89.skadnetwork
          - SKAdNetworkIdentifier: 3qcr597p9d.skadnetwork
          - SKAdNetworkIdentifier: 3qy4746246.skadnetwork
          - SKAdNetworkIdentifier: 3rd42ekr43.skadnetwork
          - SKAdNetworkIdentifier: 3sh42y64q3.skadnetwork
          - SKAdNetworkIdentifier: 4468km3ulz.skadnetwork
          - SKAdNetworkIdentifier: 44jx6755aq.skadnetwork
          - SKAdNetworkIdentifier: 47vhws6wlr.skadnetwork
          - SKAdNetworkIdentifier: 4dzt52r2t5.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 578prtvx9j.skadnetwork
          - SKAdNetworkIdentifier: 7ug5zh24hu.skadnetwork
          - SKAdNetworkIdentifier: 8c4e2ghe7u.skadnetwork
          - SKAdNetworkIdentifier: 8s468mfl3y.skadnetwork
          - SKAdNetworkIdentifier: 97r2b46745.skadnetwork
          - SKAdNetworkIdentifier: 9t245vhmpl.skadnetwork
          - SKAdNetworkIdentifier: a2p9lx4jpn.skadnetwork
          - SKAdNetworkIdentifier: c3frkrj4fj.skadnetwork
          - SKAdNetworkIdentifier: c6k4g5qg8m.skadnetwork
          - SKAdNetworkIdentifier: cp8zw746q7.skadnetwork
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: e5fvkxwrpn.skadnetwork
          - SKAdNetworkIdentifier: f38h382jlk.skadnetwork
          - SKAdNetworkIdentifier: gta9lk7p23.skadnetwork
          - SKAdNetworkIdentifier: hs6bdukanm.skadnetwork
