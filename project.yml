          - SKAdNetworkIdentifier: v72qych5uu.skadnetwork
          - SKAdNetworkIdentifier: v9wttpbfk9.skadnetwork
          - SKAdNetworkIdentifier: vutu7akeur.skadnetwork
          - SKAdNetworkIdentifier: wg4vff78zm.skadnetwork
          - SKAdNetworkIdentifier: wzmmz9fp6w.skadnetwork
          - SKAdNetworkIdentifier: y5ghdn5j9k.skadnetwork
          - SKAdNetworkIdentifier: yclnxrl5pm.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
    settings:
      base:
        PRODUCT_NAME: Cosmica
        PRODUCT_BUNDLE_IDENTIFIER: com.centricfiber.cosmica
        # Pinned per target: newer XcodeGen (2.46, CI) defaults iOS targets to iPhone+iPad, which
        # made build 126 universal (iPad screenshots demanded). Cosmica has always been iPhone-only.
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # CI only (scripts/ci/testflight-ci.sh): empty on the Mac, so automatic signing is untouched.
        PROVISIONING_PROFILE_SPECIFIER: "$(COSMICA_APP_PROFILE)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 3.1.1: alternate icons ship in the binary so App Store Connect can
        # A/B test them (Product Page Optimization). Not user-selectable.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Core AppIcon-Orb AppIcon-Gold"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
      - target: CosmicaWidget   # embedded in PlugIns/
    entitlements:
      path: Generated/Cosmica.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.centricfiber.cosmica
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.game-center: true
        com.apple.security.application-groups:
          - group.com.centricfiber.cosmica
  # v3.0.3 â€” home-screen + Lock Screen widgets. Reads the WidgetSnapshot the
  # app publishes to the shared App Group; the three shared files below are
  # Foundation-only so they compile in both targets.
  CosmicaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CosmicaWidget
        excludes:
          - "**/.DS_Store"
      - path: Cosmica/Shared/WidgetSnapshot.swift
      - path: Cosmica/Game/Engine/OfflineAccrual.swift
      - path: Cosmica/Services/Formatter.swift
      - path: Cosmica/Shared/Big.swift
    info:
      path: Generated/CosmicaWidget-Info.plist
      properties:
        CFBundleDisplayName: Cosmica
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: CosmicaWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.centricfiber.cosmica.widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        PROVISIONING_PROFILE_SPECIFIER: "$(COSMICA_WIDGET_PROFILE)"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    entitlements:
      path: Generated/CosmicaWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.centricfiber.cosmica
  CosmicaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CosmicaTests
    dependencies:
      - target: Cosmica
    settings:
      base:
        PRODUCT_NAME: CosmicaTests
        GENERATE_INFOPLIST_FILE: YES   # needed to sign the test bundle (CI ad-hoc signs)
  # v4.0 — screenshot walk of every screen on the -cosmicaDemo save (CI visual audit).
  # Lives in its own scheme so scripts/testflight.sh (scheme Cosmica) doesn't run it.
  CosmicaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - CosmicaUITests
    dependencies:
      - target: Cosmica
    settings:
      base:
        PRODUCT_NAME: CosmicaUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Cosmica
schemes:
  CosmicaScreens:
    build:
      targets:
        Cosmica: all
        CosmicaUITests: [test]
    test:
      targets:
        - CosmicaUITests
